# Optional shopping budget reminder worker; layer after compose.postgres.yaml.
services:
  web:
    environment:
      PURCHASE_WORKER_ENABLED: "true"
      SAVEFLOW_PUBLIC_ORIGIN: ${SAVEFLOW_PUBLIC_ORIGIN:-http://127.0.0.1:4300}
    depends_on:
      purchase-worker:
        condition: service_started
  purchase-worker:
    image: saveflow-docker-test:local
    command: [node, scripts/purchase-worker.mjs]
    init: true
    environment:
      DATABASE_URL: postgresql://saveflow_web:local-synthetic-web-only@pilot-db:5432/saveflow_web
      PURCHASE_WORKER_ENABLED: "true"
    depends_on:
      pilot-migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      disable: true
