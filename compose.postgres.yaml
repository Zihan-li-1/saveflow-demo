# Local synthetic persistence acceptance only; no real banking connector.
# Usage: docker compose --env-file .env.local -f compose.yaml -f compose.postgres.yaml up -d web mcp bridge
services:
  pilot-db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: saveflow_trial
      POSTGRES_PASSWORD: local-synthetic-trial-only
      POSTGRES_DB: saveflow_trial
    volumes:
      - pilot-postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U saveflow_trial -d saveflow_trial"]
      interval: 3s
      timeout: 3s
      retries: 10
  pilot-migrate:
    image: saveflow-docker-tests:local
    command: [node, scripts/migrate-banking.mjs]
    environment:
      DATABASE_URL: postgresql://saveflow_trial:local-synthetic-trial-only@pilot-db:5432/saveflow_trial
    depends_on:
      pilot-db:
        condition: service_healthy
  pilot-web-db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: saveflow_web
      POSTGRES_PASSWORD: local-synthetic-web-only
      POSTGRES_DB: saveflow_web
    volumes:
      - pilot-web-postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U saveflow_web -d saveflow_web"]
      interval: 3s
      timeout: 3s
      retries: 10
  pilot-web-migrate:
    image: saveflow-docker-tests:local
    command: [node, scripts/migrate-banking.mjs]
    environment:
      DATABASE_URL: postgresql://saveflow_web:local-synthetic-web-only@pilot-web-db:5432/saveflow_web
    depends_on:
      pilot-web-db:
        condition: service_healthy
  web:
    environment:
      DATABASE_URL: postgresql://saveflow_web:local-synthetic-web-only@pilot-web-db:5432/saveflow_web
      ALLOW_EPHEMERAL_BANKING: "false"
    depends_on:
      pilot-web-migrate:
        condition: service_completed_successfully
  mcp:
    environment:
      SAVEFLOW_TRIAL_DATABASE_URL: postgresql://saveflow_trial:local-synthetic-trial-only@pilot-db:5432/saveflow_trial
    depends_on:
      pilot-migrate:
        condition: service_completed_successfully
volumes:
  pilot-postgres:
  pilot-web-postgres:
